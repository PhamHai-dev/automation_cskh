      responses:
        '200':
          description: Updated automatic attendance settings
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/AutoAttendanceSettings'
                  meta:
                    type: [object, 'null']
        '400':
          description: Invalid delay
        '403':
          description: Admin role required

  /api/v1/attendance-reconciliation/teacher-student-info:
    get:
      summary: List students and lesson sessions in selected teacher scope
      description: >-
        Search, program, class, role scope, count and pagination are applied server-side before
        returning rows. JNPT is accepted only as a legacy alias and normalized to JLPT. For a
        pure TEACHER account, session status is derived only from teacherStatus and the response
        omits finalStatus and reconciliationState; privileged or multi-role views keep them.
      tags: [Attendance Reconciliation]
      parameters:
        - { name: teacherId, in: query, description: Required for ADMIN/MANAGE; TEACHER uses self, schema: { type: integer } }
        - { name: classId, in: query, schema: { type: integer } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: programType, in: query, description: JNPT is a legacy alias normalized to JLPT, schema: { type: string, enum: [KAIWA, JLPT, JNPT] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 25 } }
      responses:
        '200':
          description: Paginated teacher student rows with session columns
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherStudentInfoResponse' }
        '400': { description: ADMIN/MANAGE has not selected a teacher }
        '403': { description: Teacher attempted to access another teacher scope }

  /api/v1/attendance-reconciliation/teacher-sessions:
    get:
      summary: List teacher sessions and active students in actor scope
      description: >-
        Nested attendance is role-shaped. A pure TEACHER receives TeacherAttendanceView fields
        only (teacher_status, lesson_topic, teacher_note and cs_note); CS status, final status,
        reconciliation and admin resolution fields are omitted. Multi-role staff keep the
        privileged response.
      tags: [Attendance Reconciliation]
      parameters:
        - { name: startDate, in: query, required: true, schema: { type: string, format: date } }
        - { name: endDate, in: query, required: true, schema: { type: string, format: date } }
        - { name: teacherId, in: query, schema: { type: integer } }
        - { name: classId, in: query, schema: { type: integer, minimum: 1 } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: modelType, in: query, schema: { type: string, enum: ['1:1', '1:2', '1:n'] } }
        - { name: completionState, in: query, schema: { type: string, enum: [PENDING, COMPLETED] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Sessions in scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherSessionListResponse' }
        '400': { description: Invalid date range }
        '403': { description: Teacher is outside actor scope }

  /api/v1/attendance-reconciliation/teacher-tracking/pending:
    get:
      summary: List PENDING_TEACHER items in selected teacher scope without CVHT opinion fields
      tags: [Attendance Reconciliation]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: teacherId, in: query, description: Required for ADMIN/MANAGE; ignored as an override for TEACHER, schema: { type: integer } }
        - { name: classId, in: query, schema: { type: integer } }
        - { name: startDate, in: query, schema: { type: string, format: date } }
        - { name: endDate, in: query, schema: { type: string, format: date } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        '200': { description: Privacy-safe paginated teacher pending items }
        '400': { description: ADMIN/MANAGE has not selected a teacher }
        '403': { description: Teacher attempted to access another teacher scope }
  /api/v1/attendance-reconciliation/teacher-tracking/count:
    get:
      summary: Count PENDING_TEACHER items in teacher scope independently of pagination
      tags: [Attendance Reconciliation]
      parameters:
        - { name: teacherId, in: query, description: Required for ADMIN/MANAGE, schema: { type: integer } }
        - { name: classId, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Pending count
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    required: [count]
                    properties:
                      count: { type: integer }

  /api/v1/attendance-reconciliation/teacher-tracking/history:
    get:
      summary: List teacher status changes after the first attendance report
      description: Excludes first marks and edits that do not change teacher_status.
      tags: [Attendance Reconciliation]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: teacherId, in: query, description: Required for ADMIN/MANAGE, schema: { type: integer } }
        - { name: classId, in: query, schema: { type: integer } }
        - { name: startDate, in: query, schema: { type: string, format: date } }
        - { name: endDate, in: query, schema: { type: string, format: date } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        '200': { description: Paginated teacher status-change history }

  /api/v1/attendance-reconciliation/pending:
    get:
      summary: List pending attendance reconciliations in actor scope
      description: >-
        Search and allowlisted filters are combined with the actor scope before count and pagination.
        ADMIN is unrestricted; plain CS sees enrollments owned by itself; MANAGE sees itself and members
        of assigned CS groups. Search covers student name/code/phone/email, course code, package name/code,
        and class name/code. JNPT is accepted only as a legacy alias and normalized to JLPT.
      tags: [Attendance Reconciliation]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: classId, in: query, schema: { type: integer } }
        - { name: csId, in: query, schema: { type: integer } }
        - { name: teacherId, in: query, schema: { type: integer } }
        - { name: state, in: query, description: Filter to the side currently waiting, schema: { type: string, enum: [PENDING_CS, PENDING_TEACHER] } }
        - { name: startDate, in: query, schema: { type: string, format: date } }
        - { name: endDate, in: query, schema: { type: string, format: date } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: programType, in: query, description: JNPT is a legacy alias normalized to JLPT, schema: { type: string, enum: [KAIWA, JLPT, JNPT] } }
      responses:
        '200':
          description: Paginated pending items
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationListResponse' }

  /api/v1/attendance-reconciliation/conflicts:
    get:
      summary: List attendance conflicts in actor scope
      description: Uses the same scoped predicate and search fields as the pending, stats, and history endpoints before pagination.
      tags: [Attendance Reconciliation]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: classId, in: query, schema: { type: integer } }
        - { name: csId, in: query, schema: { type: integer } }
        - { name: teacherId, in: query, schema: { type: integer } }
        - { name: startDate, in: query, schema: { type: string, format: date } }
        - { name: endDate, in: query, schema: { type: string, format: date } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: programType, in: query, description: JNPT is a legacy alias normalized to JLPT, schema: { type: string, enum: [KAIWA, JLPT, JNPT] } }
      responses:
        '200':
          description: Paginated conflict items
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationListResponse' }

  /api/v1/attendance-reconciliation/stats:
    get:
      summary: KPI counts for reconciliation header cards (independent of pagination)
      description: Reuses the same actor-scoped, allowlisted predicate as the reconciliation lists.
      tags: [Attendance Reconciliation]
      parameters:
        - { name: classId, in: query, schema: { type: integer } }
        - { name: csId, in: query, schema: { type: integer } }
        - { name: teacherId, in: query, schema: { type: integer } }
        - { name: startDate, in: query, schema: { type: string, format: date } }
        - { name: endDate, in: query, schema: { type: string, format: date } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: programType, in: query, description: JNPT is a legacy alias normalized to JLPT, schema: { type: string, enum: [KAIWA, JLPT, JNPT] } }
      responses:
        '200':
          description: Counts for conflict / pending CS / pending teacher
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationStatsResponse' }

  /api/v1/attendance-reconciliation/history:
    get:
      summary: Paginated reconciliation history (changes made after the first attendance report)
      description: >-
        Returns post-first-mark attendance audit changes after applying the same ADMIN/CS/MANAGE data
        scope, search, program, class, and date predicates used by the reconciliation lists.
      tags: [Attendance Reconciliation]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: classId, in: query, schema: { type: integer } }
        - { name: csId, in: query, schema: { type: integer } }
        - { name: teacherId, in: query, schema: { type: integer } }
        - { name: startDate, in: query, schema: { type: string, format: date } }
        - { name: endDate, in: query, schema: { type: string, format: date } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: programType, in: query, description: JNPT is a legacy alias normalized to JLPT, schema: { type: string, enum: [KAIWA, JLPT, JNPT] } }
      responses:
        '200':
          description: Paginated history items
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationHistoryListResponse' }

  /api/v1/attendance-reconciliation/{attendanceId}/teacher-mark:
    post:
      summary: Record the teacher opinion for an attendance
      tags: [Attendance Reconciliation]
      parameters:
        - { name: attendanceId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttendanceOpinionInput' }
      responses:
        '200':
          description: Reconciliation updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationItemResponse' }
        '403': { description: Attendance is outside teacher scope }
        '409': { description: Invalid reconciliation transition }

  /api/v1/attendance-reconciliation/{attendanceId}/cs-mark:
    post:
      summary: Record the customer-care opinion for an attendance
      tags: [Attendance Reconciliation]
      parameters:
        - { name: attendanceId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttendanceOpinionInput' }
      responses:
        '200':
          description: Reconciliation updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationItemResponse' }
        '403': { description: Attendance is outside customer-care scope }
        '409': { description: Invalid reconciliation transition }

  /api/v1/attendance-reconciliation/bulk-approve:
    post:
      summary: Copy teacher opinions to customer-care opinions for selected PENDING_CS items
      tags: [Attendance Reconciliation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attendanceIds]
              properties:
                attendanceIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items: { type: integer }
      responses:
        '200':
          description: All selected items approved atomically
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [processed]
                    properties:
                      processed: { type: integer }
                  meta: { type: [object, 'null'] }
        '403': { description: At least one item is outside actor scope }
        '409': { description: At least one item is not PENDING_CS }

  /api/v1/attendance-reconciliation/{attendanceId}/resolve-conflict:
    post:
      summary: Resolve an attendance conflict with a mandatory reason
      tags: [Attendance Reconciliation]
      parameters:
        - { name: attendanceId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [finalStatus, resolutionNote]
              properties:
                finalStatus: { $ref: '#/components/schemas/AttendanceStatus' }
                resolutionNote: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200':
          description: Conflict resolved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationItemResponse' }
        '403': { description: Attendance is outside actor scope }
        '409': { description: Attendance is not in conflict }

  /api/v1/attendance-reconciliation/import-excel/preview:
    post:
      summary: Preview a CSKH Sheet 3 or teacher schedule workbook without database writes
      tags: [Attendance Reconciliation]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, source, targetYear]
              properties:
                file: { type: string, format: binary }
                source: { type: string, enum: [CSKH, TEACHER] }
                targetYear: { type: integer, minimum: 2020, maximum: 2100 }
      responses:
        '200': { description: Source-aware preview including CREATE, UNCHANGED, CONFLICT, INVALID and OUT_OF_SCOPE items }
        '400': { description: Invalid workbook or import inputs }
        '403': { description: Requested scope is not allowed }

  /api/v1/attendance-reconciliation/import-excel/confirm:
    post:
      summary: Re-preview and commit approved CSKH or teacher attendance workbook items
      tags: [Attendance Reconciliation]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, source, targetYear]
              properties:
                file: { type: string, format: binary }
                source: { type: string, enum: [CSKH, TEACHER] }
                targetYear: { type: integer, minimum: 2020, maximum: 2100 }
                actions:
                  type: string
                  description: JSON object mapping preview item IDs to APPLY, KEEP_DATABASE or SKIP
      responses:
        '200': { description: Commit summary with created and updated session/attendance counts }
        '400': { description: Invalid workbook or import inputs }
        '403': { description: Requested scope is not allowed }

  /api/v1/classes/{classId}/program:
    patch:
      summary: Change a class program
      description: ADMIN or MANAGE in data scope. All JLPT classes use the global template implicitly; changing JLPT to KAIWA is rejected when learning records exist.
      tags: [Classes, JLPT]
      parameters:
        - { name: classId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClassProgramInput' }
      responses:
        '200': { description: Updated class, content: { application/json: { schema: { $ref: '#/components/schemas/Class' } } } }
        '400': { description: Invalid program input }
        '403': { description: Role or data-scope restriction }
        '404': { description: Class not found in scope }
        '409': { description: Program invariant conflict }

  /api/v1/classes/{classId}/jlpt-template-status:
    get:
      summary: Inspect a class against the global JLPT session template
      tags: [Classes, JLPT]
      parameters:
        - { name: classId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Global-template match, mismatch and missing-session details }
        '403': { description: Class is outside data scope }
        '404': { description: Class or global template not found }
        '409': { description: Class is not configured as JLPT }

  /api/v1/classes/{classId}/jlpt-template/apply:
    post:
      summary: Apply global template metadata to existing class sessions
      description: Updates only session_type and session_title for matching session numbers. It never creates/deletes sessions or changes dates/times.
      tags: [Classes, JLPT]
      parameters:
        - { name: classId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Applied metadata and missing-session warnings }
        '403': { description: ADMIN or MANAGE in scope required }
        '404': { description: Class or global template not found }
        '409': { description: Class is not JLPT }

  /api/v1/jlpt/templates:
    get:
      summary: List the global JLPT session template
      description: Returns an array containing zero or one template.
      tags: [JLPT]
      parameters:
        - { name: active, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Global template collection, content: { application/json: { schema: { type: array, maxItems: 1, items: { $ref: '#/components/schemas/JlptSessionTemplate' } } } } }
        '403': { description: Role restriction }
    post:
      summary: Create the global JLPT session template (ADMIN only)
      tags: [JLPT]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JlptTemplateInput' }
      responses:
        '201': { description: Created global template, content: { application/json: { schema: { $ref: '#/components/schemas/JlptSessionTemplate' } } } }
        '400': { description: Invalid template or item }
        '403': { description: ADMIN role required }
        '409': { description: Global template already exists, or duplicate session number/TEST title }

  /api/v1/jlpt/templates/{templateId}:
    get:
      summary: Get the global JLPT session template
      tags: [JLPT]
      parameters:
        - { name: templateId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Global template detail, content: { application/json: { schema: { $ref: '#/components/schemas/JlptSessionTemplate' } } } }
        '403': { description: Role restriction }
        '404': { description: Global template not found }
    patch:
      summary: Update the global JLPT session template
      description: ADMIN, or MANAGE only when every affected JLPT class is inside the manager scope.
      tags: [JLPT]
      parameters:
        - { name: templateId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JlptTemplateInput' }
      responses:
        '200': { description: Updated global template }
        '400': { description: Invalid template or item }
        '403': { description: Role or all-affected-classes scope restriction }
        '404': { description: Global template not found }
        '409': { description: Duplicate session number/TEST title }
    delete:
      summary: Delete the global JLPT session template (ADMIN only)
      tags: [JLPT]
      parameters:
        - { name: templateId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '204': { description: Global template deleted }
        '403': { description: ADMIN role required }
        '404': { description: Global template not found }
        '409': { description: JLPT classes or learning data still depend on the global template }

  /api/v1/jlpt/templates/{templateId}/apply-preview:
    post:
      summary: Preview applying global template metadata to selected JLPT classes
      tags: [JLPT]
      parameters:
        - { name: templateId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [class_ids]
              additionalProperties: false
              properties:
                class_ids: { type: array, minItems: 1, uniqueItems: true, items: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Per-class metadata diffs and missing sessions }
        '403': { description: ADMIN or MANAGE in scope required }
        '404': { description: Global template or class not found }
        '409': { description: One or more classes are not JLPT }

  /api/v1/jlpt/templates/{templateId}/change-requests:
    post:
      summary: Submit a global-template change request from an assigned teacher
      tags: [JLPT]
      parameters:
        - { name: templateId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JlptTemplateChangeRequestInput' }
      responses:
        '201': { description: Pending request created, content: { application/json: { schema: { $ref: '#/components/schemas/JlptTemplateChangeRequest' } } } }
        '400': { description: Invalid proposed items }
        '403': { description: Teacher is not assigned to the source class }
        '404': { description: Global template or class not found }
        '409': { description: Source class is not JLPT }

  /api/v1/jlpt/template-change-requests/{requestId}/approve:
    post:
      summary: Approve and apply a pending template change request
      tags: [JLPT]
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Approved request and missing-session warnings }
        '403': { description: ADMIN or all-classes MANAGE scope required }
        '404': { description: Request not found }
        '409': { description: Request is not pending }

  /api/v1/jlpt/template-change-requests/{requestId}/reject:
    post:
      summary: Reject a pending template change request
      tags: [JLPT]
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [review_reason]
              properties: { review_reason: { type: string, minLength: 1, maxLength: 1000 } }
      responses:
        '200': { description: Rejected request }
        '403': { description: ADMIN or all-classes MANAGE scope required }
        '404': { description: Request not found }
        '409': { description: Request is not pending }

  /api/v1/classes/{classId}/sessions/{sessionId}/jlpt-records:
    get:
      summary: List JLPT learning records for eligible enrollments in a class session
      description: Includes ACTIVE enrollment classes and TRANSFERRED enrollment classes with non-deleted Attendance in this exact session. PATCH and bulk use the same eligibility; class scope, CS scope and effective teacher assignment remain enforced. No enrollment status is changed.
      tags: [JLPT, Attendance]
      parameters:
        - { name: classId, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: sessionId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Student rows with role-shaped attendance and nullable learning records, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/JlptLearningRecordRow' } } } } }
        '403': { description: Role or data-scope restriction }
        '404': { description: Class/session not found in scope }
        '409': { description: Class is not JLPT }

  /api/v1/classes/{classId}/sessions/{sessionId}/jlpt-records/{enrollmentClassId}:
    patch:
      summary: Autosave one JLPT learning-record field
      tags: [JLPT, Attendance]
      parameters:
        - { name: classId, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: sessionId, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: enrollmentClassId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JlptLearningRecordPatchInput' }
      responses:
        '200': { description: Saved record, content: { application/json: { schema: { $ref: '#/components/schemas/JlptLearningRecord' } } } }
        '400': { description: Field and value types do not match }
        '403': { description: Write role or data-scope restriction }
        '404': { description: Class/session/enrollment class not found in scope }
        '409': { description: Cross-class relation or non-JLPT class }

  /api/v1/classes/{classId}/sessions/{sessionId}/jlpt-records/bulk:
    post:
      summary: Confirmed all-or-nothing bulk update of one JLPT field
      tags: [JLPT, Attendance]
      parameters:
        - { name: classId, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: sessionId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JlptLearningRecordBulkInput' }
      responses:
        '200': { description: Updated record list }
        '400': { description: Invalid field/value or empty selection }
        '403': { description: Write role or data-scope restriction }
        '409': { description: Any selected row violates the class/session invariant }

  /api/v1/imports/jlpt/preview:
    post:
      summary: Preview a JLPT NKHT workbook without writing data (ADMIN only)
      tags: [Imports, JLPT]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, target_year]
              properties:
                file: { type: string, format: binary }
                target_year: { type: integer, minimum: 2020, maximum: 2100 }
      responses:
        '200': { description: Preview, conflicts, issues and can_confirm flag, content: { application/json: { schema: { $ref: '#/components/schemas/JlptImportPreview' } } } }
        '400': { description: Invalid workbook or target year }
        '403': { description: ADMIN role required }

  /api/v1/imports/jlpt/confirm:
    post:
      summary: Re-preview and commit a resolved JLPT NKHT workbook (ADMIN only)
      tags: [Imports, JLPT]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, target_year, preview_token, conflict_actions, normalization_resolutions]
              properties:
                file: { type: string, format: binary }
                target_year: { type: integer, minimum: 2020, maximum: 2100 }
                preview_token: { type: string }
                conflict_actions: { type: string, description: JSON map of conflict IDs to OVERWRITE or KEEP_DATABASE }
                normalization_resolutions: { type: string, description: JSON map of ambiguous issue IDs to an allowed absence status }
      responses:
        '200': { description: Import batch and commit summary }
        '400': { description: Invalid workbook or actions }
        '403': { description: ADMIN role required }
        '409': { description: Preview changed or unresolved/error issues remain }

  /api/v1/imports/export/jlpt:
    get:
      summary: Export scoped JLPT NKHT workbook using the global template
      tags: [Imports, JLPT]
      parameters:
        - { name: year, in: query, required: true, schema: { type: integer, minimum: 2020, maximum: 2100 } }
        - { name: teacher_ids, in: query, schema: { type: array, items: { type: integer, minimum: 1 } } }
        - { name: class_ids, in: query, schema: { type: array, items: { type: integer, minimum: 1 } } }
      responses:
        '200': { description: Generated xlsx workbook, content: { application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } } } }
        '400': { description: Missing year/filter or invalid level }
        '403': { description: ADMIN, MANAGE or CS in scope required; TEACHER is denied }

  /api/v1/imports/jlpt/normalization-tasks:
    get:
      summary: List scoped JLPT normalization tasks
      tags: [Imports, JLPT]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/JlptNormalizationStatus' } }
        - { name: issue_type, in: query, schema: { $ref: '#/components/schemas/JlptNormalizationIssueType' } }
        - { name: run_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: class_id, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Scoped task page, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/JlptNormalizationTask' } } } } }
        '403': { description: ADMIN or MANAGE in scope required }

  /api/v1/imports/jlpt/normalization-tasks/{taskId}/resolve:
    post:
      summary: Resolve one pending JLPT normalization task
      tags: [Imports, JLPT]
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JlptNormalizationResolutionInput' }
      responses:
        '200': { description: Resolved task with reconciliation/metadata outcome }
        '400': { description: Resolution does not match issue type }
        '403': { description: ADMIN or MANAGE in scope required }
        '404': { description: Task not found in scope }
        '409': { description: Task is not pending or target session changed }

  /api/v1/imports/jlpt/normalization-tasks/{taskId}/reject:
    post:
      summary: Reject one pending JLPT normalization task without changing learning data
      tags: [Imports, JLPT]
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: { reason: { type: string, minLength: 1, maxLength: 1000 } }
      responses:
        '200': { description: Rejected task }
        '403': { description: ADMIN or MANAGE in scope required }
        '404': { description: Task not found in scope }
        '409': { description: Task is not pending }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    FilterOperator:
      type: string
      enum: [EXACT, RANGE]

    ListMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 200 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
        facets: { type: object, additionalProperties: true }
        filterOptions: { type: object, additionalProperties: true }

    StudentListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Student' } }
        meta: { $ref: '#/components/schemas/ListMeta' }

    ClassListResponse:
      type: object
      required: [data, meta]
      properties:
