openapi: 3.1.0
info:
  title: CSKH Automation API
  version: 1.0.0
  description: Tự động hóa Chăm sóc khách hàng API

servers:
  - url: http://localhost:3000
    description: Local development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []

paths:
  /health:
    get:
      security: []
      summary: Health check endpoint
      description: Returns the health status of the API server
      tags:
        - Infrastructure
      responses:
        '200':
          description: Server is healthy

  /api/v1/auth/login:
    post:
      security: []
      summary: Login to get access token and refresh token
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
                description: HttpOnly Refresh Token
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
        '403':
          description: Account disabled

  /api/v1/auth/refresh:
    post:
      security: []
      summary: Refresh access token using HttpOnly cookie
      tags:
        - Auth
      responses:
        '200':
          description: Refresh successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
        '401':
          description: Invalid or expired refresh token

  /api/v1/auth/logout:
    post:
      summary: Logout and revoke refresh token
      tags:
        - Auth
      responses:
        '200':
          description: Logout successful

  /api/v1/auth/me:
    get:
      summary: Get current logged-in user profile
      tags:
        - Auth
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized

  /api/v1/settings/users:
    get:
      summary: List all users (Admin only)
      tags:
        - Settings/Users
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      summary: Create a new user (Admin only)
      tags:
        - Settings/Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, roles, password]
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                roles:
                  type: array
                  items:
                    type: string
                password:
                  type: string
      responses:
        '201':
          description: User created

  /api/v1/settings/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get user details (Admin only)
      tags:
        - Settings/Users
      responses:
        '200':
          description: User details
    patch:
      summary: Update user (Admin only)
      tags:
        - Settings/Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                roles:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: User updated

  /api/v1/settings/users/{id}/enable:
    post:
      summary: Enable user (Admin only)
      tags:
        - Settings/Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User enabled

  /api/v1/settings/users/{id}/disable:
    post:
      summary: Disable user (Admin only)
      tags:
        - Settings/Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User disabled

  /api/v1/settings/users/{id}/revoke-sessions:
    post:
      summary: Revoke all sessions for a user (Admin only)
      tags:
        - Settings/Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sessions revoked

  /api/v1/imports/upload:
    post:
      summary: Upload excel file and create draft import batch
      tags:
        - Imports
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, import_type]
              properties:
                file:
                  type: string
                  format: binary
                import_type:
                  type: string
                  enum: [STUDENT_ENROLLMENT, ATTENDANCE]
      responses:
        '200':
          description: File uploaded and draft batch created
        '400':
          description: Invalid file format

  /api/v1/imports/{importId}/preview:
    get:
      summary: Preview sheets, initial rows and suggested column mapping
      tags:
        - Imports
      parameters:
        - name: importId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Preview data with sheets and sample rows

  /api/v1/imports/{importId}/mapping:
    post:
      summary: Save column mapping configuration
      tags:
        - Imports
      parameters:
        - name: importId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sheetName:
                  type: string
                columnMapping:
                  type: object
      responses:
        '200':
          description: Mapping saved successfully

  /api/v1/imports/{importId}/validate:
    post:
      summary: Validate import rows against database and return report
      tags:
        - Imports
      parameters:
        - name: importId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Validation report with valid/invalid counts and errors

  /api/v1/imports/{importId}/confirm:
    post:
      summary: Execute import in batch-safe mode
      tags:
        - Imports
      parameters:
        - name: importId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Import completed with batch summary

  /api/v1/imports/{importId}:
    get:
      summary: Get import batch status and summary
      tags:
        - Imports
      parameters:
        - name: importId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Batch summary

  /api/v1/imports/{importId}/errors:
    get:
      summary: Get error rows or download error excel
      tags:
        - Imports
      parameters:
        - name: importId
          in: path
          required: true
          schema:
            type: integer
        - name: download
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Error details or Excel file stream

  /api/v1/imports/batches:
    get:
      summary: List all previous import batches
      tags:
        - Imports
      responses:
        '200':
          description: List of import batches

  /api/v1/imports/template/{type}:
    get:
      summary: Download excel template for Sheet 1 or Sheet 3
      tags:
        - Imports
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [student_enrollment, attendance]
      responses:
        '200':
          description: Excel template file

  /api/v1/imports/export/students:
    get:
      summary: Export student and enrollment data to Excel for cross-checking
      tags:
        - Imports
      responses:
        '200':
          description: Excel file

  /api/v1/imports/export/attendance:
    get:
      summary: Export attendance data to Excel for cross-checking
      tags:
        - Imports
      responses:
        '200':
          description: Excel file

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        roles:
          type: array
          items:
            type: string
        active:
          type: boolean
        last_login_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Package:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        default_total_sessions:
          type: integer
        active:
          type: boolean
        created_at:
          type: string
          format: date-time

    Student:
      type: object
      properties:
        id:
          type: integer
        full_name:
          type: string
        phone:
          type: string
        email:
          type: string
        zalo_uid:
          type: string
        created_at:
          type: string
          format: date-time

    Enrollment:
      type: object
      properties:
        id:
          type: integer
        student_id:
          type: integer
        package_id:
          type: integer
        cs_id:
          type: integer
        status:
          type: string
          enum: [NOT_STARTED, STUDYING, PAUSED, FINISHED, CANCELLED]
        total_sessions:
          type: integer
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time

    Class:
      type: object
      properties:
        id:
          type: integer
        class_code:
          type: string
        class_name:
          type: string
        model_type:
          type: string
          enum: [ONE_TO_ONE, GROUP]
        attendance_source:
          type: string
          enum: [LEARNING_SYSTEM, ZOOM]
        active:
          type: boolean
        created_at:
          type: string
          format: date-time

    TeacherProfile:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        teacher_code:
          type: string
        teacher_type:
          type: string
          enum: [VIETNAMESE, JAPANESE, OTHER]
        active:
          type: boolean

    ClassSession:
      type: object
      properties:
        id:
          type: integer
        class_id:
          type: integer
        session_number:
          type: integer
        session_date:
          type: string
          format: date
        start_time:
          type: string
        end_time:
          type: string
        teacher_id:
          type: integer
        status:
          type: string
          enum: [SCHEDULED, COMPLETED, CANCELLED]
        created_by_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Attendance:
      type: object
      properties:
        id:
          type: integer
        enrollment_class_id:
          type: integer
        class_session_id:
          type: integer
        status:
          type: string
          enum: [ATTENDED, ABSENT_APPROVED_A, LEAVE_B, ABSENT_UNAPPROVED_C, TEACHER_ABSENT_D, TECH_ERROR_E]
        source:
          type: string
          enum: [MANUAL, EXCEL_IMPORT, TEACHER_UPLOAD]
        created_by_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ImportBatch:
      type: object
      properties:
        id:
          type: integer
        uploaded_by_id:
          type: integer
        file_name:
          type: string
        import_type:
          type: string
          enum: [STUDENT_ENROLLMENT, ATTENDANCE, TEACHER_ATTENDANCE]
        total_rows:
          type: integer
        success_rows:
          type: integer
        failed_rows:
          type: integer
        status:
          type: string
          enum: [PREVIEW, PROCESSING, COMPLETED, PARTIAL_FAILED, FAILED, ROLLED_BACK]
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    ImportRow:
      type: object
      properties:
        id:
          type: integer
        import_batch_id:
          type: integer
        row_number:
          type: integer
        raw_data:
          type: object
        status:
          type: string
          enum: [PENDING, SUCCESS, FAILED]
        error_message:
          type: string
        entity_type:
          type: string
        entity_id:
          type: string
        created_at:
          type: string
          format: date-time

