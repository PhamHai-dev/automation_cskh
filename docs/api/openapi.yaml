        success: { type: boolean }
        stats: { type: object }
        moduleCounts: { type: object, additionalProperties: { type: integer } }
        items: { type: array, items: { $ref: '#/components/schemas/ActivityAuditItem' } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }
        refreshedAt: { type: string, format: date-time }

    LoginAuditListResponse:
      type: object
      required: [success, stats, items, total, page, pageSize, totalPages, refreshedAt]
      properties:
        success: { type: boolean }
        stats: { type: object }
        items: { type: array, items: { type: object } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }
        refreshedAt: { type: string, format: date-time }

    SheetSyncHistoryResponse:
      type: object
      required: [stats, items, total, page, pageSize, totalPages, refreshedAt, canRollback]
      properties:
        stats:
          type: object
          required: [todayTotal, todaySuccess, todayFailed, lastRunTime]
          properties:
            todayTotal: { type: integer }
            todaySuccess: { type: integer }
            todayFailed: { type: integer }
