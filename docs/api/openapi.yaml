          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [after_session_number, outcome]
              properties:
                after_session_number:
                  type: integer
                outcome:
                  type: string
                content:
                  type: string
      responses:
        '201':
          description: Care log created

  /api/v1/care-tasks:
    get:
      summary: List scoped care tasks with server-side search, filters and pagination
      description: ADMIN, MANAGE and CS only. Role-derived assignee scope is combined with every allowlisted filter before stable sorting and pagination. MANAGE is limited to assigned CS groups; CS is limited to self. Archived students are excluded. JLPT is canonical; legacy JNPT input is normalized to JLPT.
      tags:
        - Care
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 25 } }
        - { name: search, in: query, description: Search title, note, student, contact, package, class or assignee., schema: { type: string, maxLength: 100 } }
        - { name: program_type, in: query, schema: { type: string, enum: [KAIWA, JLPT, JNPT] } }
        - { name: status, in: query, schema: { type: string, enum: [PENDING, DONE, CANCELLED] } }
        - { name: priority, in: query, schema: { type: string, enum: [LOW, NORMAL, HIGH, URGENT] } }
        - { name: type, in: query, schema: { type: string, enum: [CALLBACK, HOT_ISSUE, FOLLOW_UP, AUTO_ATTENDANCE, SCHEDULE_DATA_ISSUE] } }
        - { name: assigned_to_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: enrollment_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: due_filter, in: query, schema: { type: string, enum: [overdue, today, this_week, all] } }
        - { name: due_from, in: query, schema: { type: string, format: date } }
        - { name: due_to, in: query, schema: { type: string, format: date } }
        - { name: created_from, in: query, schema: { type: string, format: date } }
        - { name: created_to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Scoped CareTask page with total, page, pageSize and totalPages metadata
        '400': { description: Invalid enum, ID, date or reversed range }
        '401': { description: Authentication required }
        '403': { description: Role or data-scope restriction }
    post:
      summary: Create new care task
      tags:
        - Care
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrollment_id, type]
              properties:
                enrollment_id:
                  type: integer
                assigned_to_id:
                  type: integer
                type:
                  type: string
                title:
                  type: string
                note:
                  type: string
                due_at:
                  type: string
                  format: date-time
                priority:
                  type: string
      responses:
        '201':
          description: Care task created

  /api/v1/care-tasks/{taskId}:
    get:
      summary: Get care task by ID
      tags:
        - Care
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Care task details
    patch:
      summary: Update care task
      tags:
