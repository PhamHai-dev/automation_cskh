openapi: 3.1.0
info:
  title: CSKH Automation API
  version: 1.0.0
  description: Tự động hóa Chăm sóc khách hàng API

servers:
  - url: http://localhost:3000
    description: Local development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []

paths:
  /health:
    get:
      security: []
      summary: Health check endpoint
      description: Returns the health status of the API server
      tags:
        - Infrastructure
      responses:
        '200':
          description: Server is healthy

  /api/v1/auth/login:
    post:
      security: []
      summary: Login to get access token and refresh token
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
                description: HttpOnly Refresh Token
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
        '403':
          description: Account disabled

  /api/v1/auth/refresh:
    post:
      security: []
      summary: Refresh access token using HttpOnly cookie
      tags:
        - Auth
      responses:
        '200':
          description: Refresh successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
        '401':
          description: Invalid or expired refresh token

  /api/v1/auth/logout:
    post:
      summary: Logout and revoke refresh token
      tags:
        - Auth
      responses:
        '200':
          description: Logout successful

  /api/v1/auth/me:
    get:
      summary: Get current logged-in user profile
      tags:
        - Auth
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized

  /api/v1/settings/users:
    get:
      summary: List all users (Admin only)
      tags:
        - Settings/Users
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      summary: Create a new user (Admin only)
      tags:
        - Settings/Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, roles, password]
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                roles:
                  type: array
                  items:
                    type: string
                password:
                  type: string
      responses:
        '201':
          description: User created

  /api/v1/settings/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get user details (Admin only)
      tags:
        - Settings/Users
      responses:
        '200':
          description: User details
    patch:
      summary: Update user (Admin only)
      tags:
        - Settings/Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                roles:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: User updated

  /api/v1/settings/users/{id}/enable:
    post:
      summary: Enable user (Admin only)
      tags:
        - Settings/Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User enabled

  /api/v1/settings/users/{id}/disable:
    post:
      summary: Disable user (Admin only)
      tags:
        - Settings/Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User disabled

  /api/v1/settings/users/{id}/revoke-sessions:
    post:
      summary: Revoke all sessions for a user (Admin only)
      tags:
        - Settings/Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sessions revoked

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        roles:
          type: array
          items:
            type: string
        active:
          type: boolean
        last_login_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
