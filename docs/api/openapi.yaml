openapi: 3.1.0
info:
  title: CSKH Automation API
  version: 1.0.0
  description: Tự động hóa Chăm sóc khách hàng API

servers:
  - url: http://localhost:3000
    description: Local development server


security:
  - bearerAuth: []

paths:
  /api/v1/line/accounts/{id}/qr-login:
    post:
      summary: Create a local PNG QR for a personal LINE account
      description: ADMIN, MANAGE or CS; current user must own the account. OA accounts use credentials rather than QR. No login URL is sent to an external image service.
      tags: [LINE]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: QR image or PIN is available; authentication on the phone is still required.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [accountId, status]
                    properties:
                      accountId: { type: integer }
                      status: { type: string, enum: [QR_PENDING, PIN_REQUIRED, ACTIVE, NOT_LOGGED_IN, EXPIRED] }
                      qrCode: { type: [string, 'null'], description: PNG data URI }
                      qrUrl: { type: [string, 'null'], description: PNG data URI alias }
                      pinCode: { type: [string, 'null'] }
        '400': { description: Account is an OA account }
        '401': { description: Authentication required }
        '403': { description: Account is not owned by the current user }
        '404': { description: Account not found }
        '502': { description: QR generation or verification failed }
        '504': { description: QR initialization exceeded 20 seconds }
  /api/v1/line/webhook/{accountId}:
    post:
      summary: Receive signed LINE OA events
      security: []
      tags: [LINE]
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: x-line-signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                destination: { type: string }
                events: { type: array, items: { type: object } }
      responses:
        '200': { description: Accepted event batch; response includes processed count }
        '401': { description: Missing or invalid signature, secret or raw request body }
  /api/v1/zalo/accounts/{id}/qr-login:
    post:
      summary: Generate a Zalo QR image without waiting for phone confirmation
      tags: [Zalo]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: QR generated; completion is reported by authenticated account socket events.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      qrDataUrl: { type: string }
        '401': { description: Authentication required }
        '403': { description: Current user does not own the account }
  /api/v1/zalo/accounts/{id}/reconnect:
    post:
      summary: Restore the account using its encrypted saved session
      tags: [Zalo]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Reconnect initiated; account status is reported asynchronously }
        '400': { description: No saved session }
        '401': { description: Authentication required }
        '403': { description: Current user does not own the account }
        '409': { description: Account was disconnected manually and requires a new QR login }
  /api/v1/students:
    get:
      summary: List students with scoped server-side filters and pagination
      description: ADMIN, MANAGE and CS only. Filters are allowlisted and combined with the current user's enrollment data scope before pagination. Search, totals, facets and filter options use the same scope. Archived students are excluded. JLPT is canonical; legacy JNPT input is normalized by clients before use.
      tags: [Students]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 25 } }
        - { name: search, in: query, description: Search student, contact, class, teacher or external identifiers., schema: { type: string, maxLength: 100 } }
        - { name: program_type, in: query, schema: { type: string, enum: [KAIWA, JLPT] } }
        - { name: cs_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: cvht, in: query, description: CVHT code, ID-prefixed value, or UNASSIGNED., schema: { type: string } }
        - { name: gender, in: query, schema: { type: string, enum: [MALE, FEMALE, OTHER] } }
        - { name: status, in: query, schema: { type: string } }
        - { name: model, in: query, schema: { type: string, enum: ['1:1', '1:2', '1:n'] } }
        - { name: payment, in: query, schema: { type: string, enum: [PAID, DEBT, UNSET] } }
        - { name: sale, in: query, schema: { type: string } }
        - { name: package_name, in: query, schema: { type: string } }
        - { name: course_code, in: query, schema: { type: string } }
        - { name: teacher_name, in: query, schema: { type: string } }
        - { name: teacher_code, in: query, schema: { type: string } }
        - { name: class_name, in: query, schema: { type: string } }
        - { name: class_code, in: query, schema: { type: string } }
        - { name: schedule_pattern, in: query, schema: { type: string } }
        - { name: start_time, in: query, schema: { type: string } }
        - { name: start_date_op, in: query, schema: { $ref: '#/components/schemas/FilterOperator' } }
        - { name: start_date_exact, in: query, schema: { type: string, format: date } }
        - { name: start_date_from, in: query, schema: { type: string, format: date } }
        - { name: start_date_to, in: query, schema: { type: string, format: date } }
        - { name: end_date_op, in: query, schema: { $ref: '#/components/schemas/FilterOperator' } }
        - { name: end_date_exact, in: query, schema: { type: string, format: date } }
        - { name: end_date_from, in: query, schema: { type: string, format: date } }
        - { name: end_date_to, in: query, schema: { type: string, format: date } }
        - { name: total_sessions_op, in: query, schema: { $ref: '#/components/schemas/FilterOperator' } }
        - { name: total_sessions_exact, in: query, schema: { type: integer, minimum: 0 } }
        - { name: total_sessions_min, in: query, schema: { type: integer, minimum: 0 } }
        - { name: total_sessions_max, in: query, schema: { type: integer, minimum: 0 } }
        - { name: remaining_sessions_op, in: query, schema: { $ref: '#/components/schemas/FilterOperator' } }
        - { name: remaining_sessions_exact, in: query, schema: { type: integer } }
        - { name: remaining_sessions_min, in: query, schema: { type: integer } }
        - { name: remaining_sessions_max, in: query, schema: { type: integer } }
        - { name: has_class, in: query, schema: { type: boolean } }
        - { name: has_teacher, in: query, schema: { type: boolean } }
        - { name: birth_year_min, in: query, schema: { type: integer, minimum: 0 } }
        - { name: birth_year_max, in: query, schema: { type: integer, minimum: 0 } }
        - { name: occupation, in: query, schema: { type: string } }
      responses:
        '200':
          description: Paginated student list and scoped filter metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentListResponse' }
        '400': { description: Invalid query parameters }
        '401': { description: Authentication required }
        '403': { description: Role or data-scope restriction }

  /api/v1/students/{studentId}:
    delete:
      summary: Soft-delete a student profile (ADMIN only)
      description: Archives the student from all product views by setting deleted_at and deleted_by_id. The Student row and all related enrollments, classes, attendance, care, and messaging history remain stored in the database.
      tags: [Students]
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '204': { description: Student archived successfully; no response body }
        '400': { description: Invalid student ID }
        '401': { description: Authentication required }
        '403': { description: ADMIN role required }
        '404': { description: Active student not found }

  /api/v1/classes:
    get:
      summary: List classes with server-side learning filters and pagination
      description: Filters are allowlisted and applied within the current user's data scope before pagination. ADMIN is unrestricted; CS sees classes containing an active enrollment it owns or can view; MANAGE sees classes containing an active enrollment owned by self or assigned CS groups; TEACHER sees assigned classes only. The same scope applies to totals, facets, and filter options, and archived students never grant class visibility. `JLPT` is canonical; legacy `JNPT` is accepted as an input alias and normalized to `JLPT`.
      tags: [Classes]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 25 } }
        - { name: search, in: query, description: Search class, student, contact, teacher, or external identifiers., schema: { type: string, maxLength: 100 } }
        - { name: program_type, in: query, schema: { type: string, enum: [KAIWA, JLPT] } }
        - { name: status, in: query, schema: { type: string } }
        - { name: package_name, in: query, schema: { type: string } }
        - { name: course_category, in: query, description: Canonical values are KAIWA and JLPT. Legacy JNPT is accepted temporarily., schema: { type: string, enum: [KAIWA, JLPT, JNPT] } }
        - { name: course_level, in: query, description: Independent level filter for Kaiwa only., schema: { type: string } }
        - { name: teacher_name, in: query, schema: { type: string } }
        - { name: teacher_code, in: query, schema: { type: string } }
        - { name: class_name, in: query, schema: { type: string } }
        - { name: model_filter, in: query, schema: { type: string, enum: ['1:1', '1:2', '1:n'] } }
        - { name: schedule_pattern, in: query, schema: { type: string } }
        - { name: start_time, in: query, schema: { type: string } }
        - { name: sale, in: query, schema: { type: string } }
        - { name: start_date_op, in: query, schema: { $ref: '#/components/schemas/FilterOperator' } }
        - { name: start_date_exact, in: query, schema: { type: string, format: date } }
        - { name: start_date_from, in: query, schema: { type: string, format: date } }
        - { name: start_date_to, in: query, schema: { type: string, format: date } }
        - { name: end_date_op, in: query, schema: { $ref: '#/components/schemas/FilterOperator' } }
        - { name: end_date_exact, in: query, schema: { type: string, format: date } }
        - { name: end_date_from, in: query, schema: { type: string, format: date } }
        - { name: end_date_to, in: query, schema: { type: string, format: date } }
        - { name: total_sessions_op, in: query, schema: { $ref: '#/components/schemas/FilterOperator' } }
        - { name: total_sessions_exact, in: query, schema: { type: integer, minimum: 0 } }
        - { name: total_sessions_min, in: query, schema: { type: integer, minimum: 0 } }
        - { name: total_sessions_max, in: query, schema: { type: integer, minimum: 0 } }
        - { name: remaining_sessions_op, in: query, schema: { $ref: '#/components/schemas/FilterOperator' } }
        - { name: remaining_sessions_exact, in: query, schema: { type: integer, minimum: 0 } }
        - { name: remaining_sessions_min, in: query, schema: { type: integer, minimum: 0 } }
        - { name: remaining_sessions_max, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: Paginated class list and filter metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassListResponse' }
        '400': { description: Invalid query parameters }
        '401': { description: Authentication required }
        '403': { description: Role or data-scope restriction }

  /api/v1/enrollments:
    get:
      summary: List enrollments with server-side learning filters and pagination
      description: Filters are allowlisted and applied within the current user's data scope before pagination. `JLPT` is canonical; legacy `JNPT` is accepted as an input alias and normalized to `JLPT`. JLPT has no independent course-level filter.
      tags: [Enrollments]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 25 } }
        - { name: search, in: query, description: Search student, contact, class, teacher, or external identifiers., schema: { type: string, maxLength: 100 } }
        - { name: program_type, in: query, schema: { type: string, enum: [KAIWA, JLPT] } }
        - { name: cs_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: sale, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: package_name, in: query, schema: { type: string } }
        - { name: course_category, in: query, description: Canonical values are KAIWA and JLPT. Legacy JNPT is accepted temporarily., schema: { type: string, enum: [KAIWA, JLPT, JNPT] } }
        - { name: course_level, in: query, description: Independent level filter for Kaiwa only., schema: { type: string } }
        - { name: teacher_name, in: query, schema: { type: string } }
        - { name: teacher_code, in: query, schema: { type: string } }
        - { name: class_name, in: query, schema: { type: string } }
        - { name: model_filter, in: query, schema: { type: string, enum: ['1:1', '1:2', '1:n'] } }
        - { name: schedule_pattern, in: query, schema: { type: string } }
        - { name: start_time, in: query, schema: { type: string } }
        - { name: start_date_op, in: query, schema: { $ref: '#/components/schemas/FilterOperator' } }
        - { name: start_date_exact, in: query, schema: { type: string, format: date } }
        - { name: start_date_from, in: query, schema: { type: string, format: date } }
        - { name: start_date_to, in: query, schema: { type: string, format: date } }
        - { name: end_date_op, in: query, schema: { $ref: '#/components/schemas/FilterOperator' } }
        - { name: end_date_exact, in: query, schema: { type: string, format: date } }
        - { name: end_date_from, in: query, schema: { type: string, format: date } }
        - { name: end_date_to, in: query, schema: { type: string, format: date } }
        - { name: total_sessions_op, in: query, schema: { $ref: '#/components/schemas/FilterOperator' } }
        - { name: total_sessions_exact, in: query, schema: { type: integer, minimum: 0 } }
        - { name: total_sessions_min, in: query, schema: { type: integer, minimum: 0 } }
        - { name: total_sessions_max, in: query, schema: { type: integer, minimum: 0 } }
        - { name: attended_sessions_op, in: query, schema: { $ref: '#/components/schemas/FilterOperator' } }
        - { name: attended_sessions_exact, in: query, schema: { type: integer, minimum: 0 } }
        - { name: attended_sessions_min, in: query, schema: { type: integer, minimum: 0 } }
        - { name: attended_sessions_max, in: query, schema: { type: integer, minimum: 0 } }
        - { name: remaining_sessions_op, in: query, schema: { $ref: '#/components/schemas/FilterOperator' } }
        - { name: remaining_sessions_exact, in: query, schema: { type: integer, minimum: 0 } }
        - { name: remaining_sessions_min, in: query, schema: { type: integer, minimum: 0 } }
        - { name: remaining_sessions_max, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: Paginated enrollment list and filter metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollmentListResponse' }
        '400': { description: Invalid query parameters }
        '401': { description: Authentication required }
        '403': { description: Role or data-scope restriction }

  /api/v1/teachers:
    get:
      summary: List teachers with server-side search, filters, and pagination
      tags: [Teachers]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: active, in: query, schema: { type: boolean } }
        - { name: teacher_type, in: query, schema: { type: string, enum: [VIETNAMESE, JAPANESE, OTHER] } }
        - { name: account_status, in: query, schema: { type: string, enum: [HAS_ACCOUNT, NO_ACCOUNT, ACTIVE_ACCOUNT, LOCKED_ACCOUNT, PROVISIONED, UNPROVISIONED] } }
      responses:
        '200':
          description: Paginated teacher list
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Teacher' } }
                  meta:
                    type: object
                    required: [page, pageSize, total, totalPages]
                    properties:
                      page: { type: integer }
                      pageSize: { type: integer }
                      total: { type: integer }
                      totalPages: { type: integer }
        '400': { description: Invalid query parameters }
        '401': { description: Authentication required }
        '403': { description: Role or data-scope restriction }

  /api/v1/teachers/me:
    get:
      summary: Get the current teacher's own profile
      tags: [Teachers]
      responses:
        '200':
          description: Current teacher profile
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Teacher' }
                  meta: { type: 'null' }
        '401': { description: Authentication required }
        '403': { description: TEACHER role required }
        '404': { description: Active linked teacher profile not found }
    patch:
      summary: Update the current teacher's contact information
      description: Teachers may update only their own contact email and phone. Code, name, type, active status, and account fields remain read-only.
      tags: [Teachers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                phone: { type: [string, 'null'], maxLength: 30 }
                email: { type: [string, 'null'], format: email, maxLength: 255 }
      responses:
        '200':
          description: Updated current teacher profile
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Teacher' }
                  meta: { type: 'null' }
        '400': { description: Invalid contact information }
        '401': { description: Authentication required }
        '403': { description: TEACHER role required }
        '404': { description: Linked teacher profile not found }

  /api/v1/settings/auto-attendance/run:
    post:
      summary: Run today's auto-attendance cycle and retry FAILED executions (ADMIN only)
      description: Scheduler never retries automatically. Manual runs atomically claim FAILED executions for today; COMPLETED, SKIPPED and PROCESSING executions are not rerun. Existing attendance is never overwritten.
      tags: [Attendance]
      responses:
        '200':
          description: Cycle completed; inspect failed_count for per-schedule failures.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      processed_schedules: { type: integer }
                      attended_count: { type: integer }
                      skipped_count: { type: integer }
                      failed_count: { type: integer }
                      issues_created: { type: integer }
                  meta: { type: 'null' }
        '401':
          description: Authentication required
        '403':
          description: ADMIN role required

  /health:
    get:
      security: []
      summary: Health check endpoint
      description: Returns the health status of the API server
      tags:
        - Infrastructure
      responses:
        '200':
          description: Server is healthy

  /api/v1/auth/login:
    post:
      security: []
      summary: Login to get access token and refresh token
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
                description: HttpOnly Refresh Token
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
        '403':
          description: Account disabled

  /api/v1/auth/refresh:
    post:
      security: []
      summary: Refresh access token using HttpOnly cookie
      tags:
        - Auth
      responses:
        '200':
          description: Refresh successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
        '401':
          description: Invalid or expired refresh token

  /api/v1/auth/logout:
    post:
      summary: Logout and revoke refresh token
      tags:
        - Auth
      responses:
        '200':
          description: Logout successful

  /api/v1/auth/me:
    get:
      summary: Get current logged-in user profile
      tags:
        - Auth
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized

  /api/v1/settings/users:
    get:
      summary: List all users (Admin only)
      tags:
        - Settings/Users
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      summary: Create a new user (Admin only)
      tags:
        - Settings/Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, roles, password]
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                roles:
                  type: array
                  items:
                    type: string
                password:
                  type: string
      responses:
        '201':
          description: User created

  /api/v1/settings/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get user details (Admin only)
      tags:
        - Settings/Users
      responses:
        '200':
          description: User details
    patch:
      summary: Update user (Admin only)
      tags:
        - Settings/Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                roles:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: User updated

  /api/v1/settings/users/{id}/enable:
    post:
      summary: Enable user (Admin only)
      tags:
        - Settings/Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User enabled

  /api/v1/settings/users/{id}/disable:
    post:
      summary: Disable user (Admin only)
      tags:
        - Settings/Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User disabled

  /api/v1/settings/users/{id}/revoke-sessions:
    post:
      summary: Revoke all sessions for a user (Admin only)
      tags:
        - Settings/Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sessions revoked

  /api/v1/imports/upload:
    post:
      summary: Upload excel file and create draft import batch
      tags:
        - Imports
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, import_type]
              properties:
                file:
                  type: string
                  format: binary
                import_type:
                  type: string
                  enum: [STUDENT_ENROLLMENT, ATTENDANCE]
      responses:
        '200':
          description: File uploaded and draft batch created
        '400':
          description: Invalid file format

  /api/v1/imports/{importId}/preview:
    get:
      summary: Preview sheets, initial rows and suggested column mapping
      tags:
        - Imports
      parameters:
        - name: importId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Preview data with sheets and sample rows

  /api/v1/imports/{importId}/mapping:
    post:
      summary: Save column mapping configuration
      tags:
        - Imports
      parameters:
        - name: importId
          in: path
