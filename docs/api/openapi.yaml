openapi: 3.1.0
info:
  title: CSKH Automation API
  version: 1.0.0
  description: Tự động hóa Chăm sóc khách hàng API

servers:
  - url: http://localhost:3000
    description: Local development server


security:
  - bearerAuth: []

paths:
  /api/v1/settings/auto-attendance/run:
    post:
      summary: Run today's auto-attendance cycle and retry FAILED executions (ADMIN only)
      description: Scheduler never retries automatically. Manual runs atomically claim FAILED executions for today; COMPLETED, SKIPPED and PROCESSING executions are not rerun. Existing attendance is never overwritten.
      tags: [Attendance]
      responses:
        '200':
          description: Cycle completed; inspect failed_count for per-schedule failures.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      processed_schedules: { type: integer }
                      attended_count: { type: integer }
                      skipped_count: { type: integer }
                      failed_count: { type: integer }
                      issues_created: { type: integer }
                  meta: { type: 'null' }
        '401':
          description: Authentication required
        '403':
          description: ADMIN role required

  /health:
    get:
      security: []
      summary: Health check endpoint
      description: Returns the health status of the API server
      tags:
        - Infrastructure
      responses:
        '200':
          description: Server is healthy

  /api/v1/auth/login:
    post:
      security: []
      summary: Login to get access token and refresh token
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
                description: HttpOnly Refresh Token
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
        '403':
          description: Account disabled

  /api/v1/auth/refresh:
    post:
      security: []
      summary: Refresh access token using HttpOnly cookie
      tags:
        - Auth
      responses:
        '200':
          description: Refresh successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
        '401':
          description: Invalid or expired refresh token

  /api/v1/auth/logout:
    post:
      summary: Logout and revoke refresh token
      tags:
        - Auth
      responses:
        '200':
          description: Logout successful

  /api/v1/auth/me:
    get:
      summary: Get current logged-in user profile
      tags:
        - Auth
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized

  /api/v1/settings/users:
    get:
      summary: List all users (Admin only)
      tags:
        - Settings/Users
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      summary: Create a new user (Admin only)
      tags:
        - Settings/Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, roles, password]
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                roles:
                  type: array
                  items:
                    type: string
                password:
                  type: string
      responses:
        '201':
          description: User created

  /api/v1/settings/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get user details (Admin only)
      tags:
        - Settings/Users
      responses:
        '200':
          description: User details
    patch:
      summary: Update user (Admin only)
      tags:
        - Settings/Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                roles:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: User updated

  /api/v1/settings/users/{id}/enable:
    post:
      summary: Enable user (Admin only)
      tags:
        - Settings/Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User enabled

  /api/v1/settings/users/{id}/disable:
    post:
      summary: Disable user (Admin only)
      tags:
        - Settings/Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User disabled

  /api/v1/settings/users/{id}/revoke-sessions:
    post:
      summary: Revoke all sessions for a user (Admin only)
      tags:
        - Settings/Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sessions revoked

  /api/v1/imports/upload:
    post:
      summary: Upload excel file and create draft import batch
      tags:
        - Imports
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, import_type]
              properties:
                file:
                  type: string
                  format: binary
                import_type:
                  type: string
                  enum: [STUDENT_ENROLLMENT, ATTENDANCE]
      responses:
        '200':
          description: File uploaded and draft batch created
        '400':
          description: Invalid file format

  /api/v1/imports/{importId}/preview:
    get:
      summary: Preview sheets, initial rows and suggested column mapping
      tags:
        - Imports
      parameters:
        - name: importId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Preview data with sheets and sample rows

  /api/v1/imports/{importId}/mapping:
    post:
      summary: Save column mapping configuration
      tags:
        - Imports
      parameters:
        - name: importId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sheetName:
                  type: string
                columnMapping:
                  type: object
      responses:
        '200':
          description: Mapping saved successfully

  /api/v1/imports/{importId}/validate:
    post:
      summary: Validate import rows against database and return report
      tags:
        - Imports
      parameters:
        - name: importId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Validation report with valid/invalid counts and errors

  /api/v1/imports/{importId}/confirm:
    post:
      summary: Execute import in batch-safe mode
      tags:
        - Imports
      parameters:
        - name: importId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Import completed with batch summary

  /api/v1/imports/{importId}:
    get:
      summary: Get import batch status and summary
      tags:
        - Imports
      parameters:
        - name: importId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Batch summary

  /api/v1/imports/{importId}/errors:
    get:
      summary: Get error rows or download error excel
      tags:
        - Imports
      parameters:
        - name: importId
          in: path
          required: true
          schema:
            type: integer
        - name: download
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Error details or Excel file stream

  /api/v1/imports/batches:
    get:
      summary: List all previous import batches
      tags:
        - Imports
      responses:
        '200':
          description: List of import batches

  /api/v1/imports/template/{type}:
    get:
      summary: Download excel template for Sheet 1 or Sheet 3
      tags:
        - Imports
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [student_enrollment, attendance]
      responses:
        '200':
          description: Excel template file

  /api/v1/imports/export/students:
    get:
      summary: Export student and enrollment data to Excel for cross-checking
      tags:
        - Imports
      responses:
        '200':
          description: Excel file

  /api/v1/imports/export/attendance:
    get:
      summary: Export attendance data to Excel for cross-checking
      tags:
        - Imports
      responses:
        '200':
          description: Excel file

  /api/v1/enrollments/{enrollmentId}/care-logs:
    get:
      summary: Get care log history for an enrollment
      tags:
        - Care
      parameters:
        - name: enrollmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of care logs
    post:
      summary: Create new care log for an enrollment
      tags:
        - Care
      parameters:
        - name: enrollmentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [after_session_number, outcome]
              properties:
                after_session_number:
                  type: integer
                outcome:
                  type: string
                content:
                  type: string
      responses:
        '201':
          description: Care log created

  /api/v1/care-tasks:
    get:
      summary: List care tasks with filters
      tags:
        - Care
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: assigned_to_id
          in: query
          schema:
            type: integer
        - name: enrollment_id
          in: query
          schema:
            type: integer
        - name: due_filter
          in: query
          schema:
            type: string
            enum: [overdue, today, this_week, all]
      responses:
        '200':
          description: Care tasks list
    post:
      summary: Create new care task
      tags:
        - Care
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrollment_id, type]
              properties:
                enrollment_id:
                  type: integer
                assigned_to_id:
                  type: integer
                type:
                  type: string
                title:
                  type: string
                note:
                  type: string
                due_at:
                  type: string
                  format: date-time
                priority:
                  type: string
      responses:
        '201':
          description: Care task created

  /api/v1/care-tasks/{taskId}:
    get:
      summary: Get care task by ID
      tags:
        - Care
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Care task details
    patch:
      summary: Update care task
      tags:
        - Care
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Care task updated

  /api/v1/care-tasks/{taskId}/complete:
    post:
      summary: Mark care task as completed
      tags:
        - Care
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Care task completed

  /api/v1/care-tasks/{taskId}/cancel:
    post:
      summary: Cancel care task
      tags:
        - Care
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Care task cancelled

  /api/v1/dashboard/summary:
    get:
      summary: Get enrollment summary stats and percentages
      tags:
        - Dashboard
      parameters:
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
        - name: cs_id
          in: query
          schema:
            type: integer
        - name: package_id
          in: query
          schema:
            type: integer
        - name: class_id
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Summary statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EnrollmentSummaryStats'
                  meta:
                    type: [object, 'null']

  /api/v1/dashboard/attendance:
    get:
      summary: Get attendance metrics and breakdown
      tags:
        - Dashboard
      parameters:
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
        - name: cs_id
          in: query
          schema:
            type: integer
        - name: package_id
          in: query
          schema:
            type: integer
        - name: class_id
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Attendance metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AttendanceStats'
                  meta:
                    type: [object, 'null']

  /api/v1/dashboard/care-pivot:
    get:
      summary: Get care logs outcome pivot matrix by session number
      tags:
        - Dashboard
      parameters:
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
        - name: cs_id
          in: query
          schema:
            type: integer
        - name: package_id
          in: query
          schema:
            type: integer
        - name: class_id
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Care outcome pivot matrix
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CarePivotMatrix'
                  meta:
                    type: [object, 'null']

  /api/v1/dashboard/tasks-overview:
    get:
      summary: Get care tasks overview counts (overdue, due today, urgent)
      tags:
        - Dashboard
      parameters:
        - name: cs_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Care tasks overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TasksOverviewStats'
                  meta:
                    type: [object, 'null']

  /api/v1/settings/auto-attendance:
    get:
      summary: Get automatic attendance settings (Admin only)
      tags: [Settings/Auto Attendance]
      responses:
        '200':
          description: Current automatic attendance settings
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/AutoAttendanceSettings'
                  meta:
                    type: [object, 'null']
    patch:
      summary: Update automatic attendance settings (Admin only)
      tags: [Settings/Auto Attendance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delay_minutes]
              properties:
                delay_minutes:
                  type: integer
                  minimum: 0
                  maximum: 1440
                enabled:
                  type: boolean
                  description: Bật/tắt chu kỳ điểm danh tự động ngầm (cron). Quét thủ công /run vẫn luôn chạy.
      responses:
        '200':
          description: Updated automatic attendance settings
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/AutoAttendanceSettings'
                  meta:
                    type: [object, 'null']
        '400':
          description: Invalid delay
        '403':
          description: Admin role required

  /api/v1/attendance-reconciliation/teacher-sessions:
    get:
      summary: List teacher sessions and active students in actor scope
      tags: [Attendance Reconciliation]
      parameters:
        - { name: startDate, in: query, required: true, schema: { type: string, format: date } }
        - { name: endDate, in: query, required: true, schema: { type: string, format: date } }
        - { name: teacherId, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Sessions in scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherSessionListResponse' }
        '400': { description: Invalid date range }
        '403': { description: Teacher is outside actor scope }

  /api/v1/attendance-reconciliation/teacher-tracking/pending:
    get:
      summary: List PENDING_TEACHER items in selected teacher scope without CSKH opinion fields
      tags: [Attendance Reconciliation]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: teacherId, in: query, description: Required for ADMIN/MANAGE; ignored as an override for TEACHER, schema: { type: integer } }
        - { name: classId, in: query, schema: { type: integer } }
        - { name: startDate, in: query, schema: { type: string, format: date } }
        - { name: endDate, in: query, schema: { type: string, format: date } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        '200': { description: Privacy-safe paginated teacher pending items }
        '400': { description: ADMIN/MANAGE has not selected a teacher }
        '403': { description: Teacher attempted to access another teacher scope }

  /api/v1/attendance-reconciliation/teacher-tracking/count:
    get:
      summary: Count PENDING_TEACHER items in teacher scope independently of pagination
      tags: [Attendance Reconciliation]
      parameters:
        - { name: teacherId, in: query, description: Required for ADMIN/MANAGE, schema: { type: integer } }
        - { name: classId, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Pending count
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    required: [count]
                    properties:
                      count: { type: integer }

  /api/v1/attendance-reconciliation/teacher-tracking/history:
    get:
      summary: List teacher status changes after the first attendance report
      description: Excludes first marks and edits that do not change teacher_status.
      tags: [Attendance Reconciliation]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: teacherId, in: query, description: Required for ADMIN/MANAGE, schema: { type: integer } }
        - { name: classId, in: query, schema: { type: integer } }
        - { name: startDate, in: query, schema: { type: string, format: date } }
        - { name: endDate, in: query, schema: { type: string, format: date } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        '200': { description: Paginated teacher status-change history }

  /api/v1/attendance-reconciliation/pending:
    get:
      summary: List pending attendance reconciliations in actor scope
      tags: [Attendance Reconciliation]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: classId, in: query, schema: { type: integer } }
        - { name: csId, in: query, schema: { type: integer } }
        - { name: teacherId, in: query, schema: { type: integer } }
        - { name: state, in: query, description: Filter to the side currently waiting, schema: { type: string, enum: [PENDING_CS, PENDING_TEACHER] } }
        - { name: startDate, in: query, schema: { type: string, format: date } }
        - { name: endDate, in: query, schema: { type: string, format: date } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        '200':
          description: Paginated pending items
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationListResponse' }

  /api/v1/attendance-reconciliation/conflicts:
    get:
      summary: List attendance conflicts in actor scope
      tags: [Attendance Reconciliation]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: classId, in: query, schema: { type: integer } }
        - { name: csId, in: query, schema: { type: integer } }
        - { name: teacherId, in: query, schema: { type: integer } }
        - { name: startDate, in: query, schema: { type: string, format: date } }
        - { name: endDate, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Paginated conflict items
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationListResponse' }

  /api/v1/attendance-reconciliation/stats:
    get:
      summary: KPI counts for reconciliation header cards (independent of pagination)
      tags: [Attendance Reconciliation]
      parameters:
        - { name: classId, in: query, schema: { type: integer } }
        - { name: csId, in: query, schema: { type: integer } }
        - { name: startDate, in: query, schema: { type: string, format: date } }
        - { name: endDate, in: query, schema: { type: string, format: date } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        '200':
          description: Counts for conflict / pending CS / pending teacher
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationStatsResponse' }

  /api/v1/attendance-reconciliation/history:
    get:
      summary: Paginated reconciliation history (changes made after the first attendance report)
      description: Returns attendance audit changes scoped to the actor (CS sees only assigned students). Only post-first-mark actions are included: CS mark, bulk approve, conflict resolve.
      tags: [Attendance Reconciliation]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: classId, in: query, schema: { type: integer } }
        - { name: csId, in: query, schema: { type: integer } }
        - { name: startDate, in: query, schema: { type: string, format: date } }
        - { name: endDate, in: query, schema: { type: string, format: date } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        '200':
          description: Paginated history items
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationHistoryListResponse' }

  /api/v1/attendance-reconciliation/{attendanceId}/teacher-mark:
    post:
      summary: Record the teacher opinion for an attendance
      tags: [Attendance Reconciliation]
      parameters:
        - { name: attendanceId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttendanceOpinionInput' }
      responses:
        '200':
          description: Reconciliation updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationItemResponse' }
        '403': { description: Attendance is outside teacher scope }
        '409': { description: Invalid reconciliation transition }

  /api/v1/attendance-reconciliation/{attendanceId}/cs-mark:
    post:
      summary: Record the customer-care opinion for an attendance
      tags: [Attendance Reconciliation]
      parameters:
        - { name: attendanceId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttendanceOpinionInput' }
      responses:
        '200':
          description: Reconciliation updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationItemResponse' }
        '403': { description: Attendance is outside customer-care scope }
        '409': { description: Invalid reconciliation transition }

  /api/v1/attendance-reconciliation/bulk-approve:
    post:
      summary: Copy teacher opinions to customer-care opinions for selected PENDING_CS items
      tags: [Attendance Reconciliation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attendanceIds]
              properties:
                attendanceIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items: { type: integer }
      responses:
        '200':
          description: All selected items approved atomically
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [processed]
                    properties:
                      processed: { type: integer }
                  meta: { type: [object, 'null'] }
        '403': { description: At least one item is outside actor scope }
        '409': { description: At least one item is not PENDING_CS }

  /api/v1/attendance-reconciliation/{attendanceId}/resolve-conflict:
    post:
      summary: Resolve an attendance conflict with a mandatory reason
      tags: [Attendance Reconciliation]
      parameters:
        - { name: attendanceId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [finalStatus, resolutionNote]
              properties:
                finalStatus: { $ref: '#/components/schemas/AttendanceStatus' }
                resolutionNote: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200':
          description: Conflict resolved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationItemResponse' }
        '403': { description: Attendance is outside actor scope }
        '409': { description: Attendance is not in conflict }

  /api/v1/attendance-reconciliation/{source}-workbook/preview:
    post:
      summary: Preview a teacher or customer-care attendance workbook without database writes
      tags: [Attendance Reconciliation]
      parameters:
        - name: source
          in: path
          required: true
          schema: { type: string, enum: [teacher, cs] }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                teacherId: { type: integer }
      responses:
        '200':
          description: Workbook preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkbookPreviewResponse' }
        '400': { description: Invalid workbook or MIME type }
        '403': { description: Requested scope is not allowed }

  /api/v1/attendance-reconciliation/{source}-workbook/{previewId}/commit:
    post:
      summary: Commit valid cells from an unexpired workbook preview
      tags: [Attendance Reconciliation]
      parameters:
        - name: source
          in: path
          required: true
          schema: { type: string, enum: [teacher, cs] }
        - { name: previewId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmOverwrite]
              properties:
                confirmOverwrite: { type: boolean, const: true }
      responses:
        '200':
          description: Valid preview cells committed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkbookCommitResponse' }
        '404': { description: Preview not found or expired }
        '409': { description: Preview was already committed or source data changed }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        roles:
          type: array
          items:
            type: string
        active:
          type: boolean
        last_login_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Package:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        default_total_sessions:
          type: integer
        active:
          type: boolean
        created_at:
          type: string
          format: date-time

    Student:
      type: object
      properties:
        id:
          type: integer
        full_name:
          type: string
        phone:
          type: string
        email:
          type: string
        zalo_uid:
          type: string
        created_at:
          type: string
          format: date-time

    Enrollment:
      type: object
      properties:
        id:
          type: integer
        student_id:
          type: integer
        package_id:
          type: integer
        cs_id:
          type: integer
        status:
          type: string
          enum: [NOT_STARTED, STUDYING, PAUSED, FINISHED, CANCELLED]
        total_sessions:
          type: integer
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time

    Class:
      type: object
      properties:
        id:
          type: integer
        class_code:
          type: string
        class_name:
          type: string
        model_type:
          type: string
          enum: [ONE_TO_ONE, GROUP]
        attendance_source:
          type: string
          enum: [LEARNING_SYSTEM, ZOOM]
        active:
          type: boolean
        created_at:
          type: string
          format: date-time

    TeacherProfile:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        teacher_code:
          type: string
        teacher_type:
          type: string
          enum: [VIETNAMESE, JAPANESE, OTHER]
        active:
          type: boolean

    ClassSession:
      type: object
      properties:
        id:
          type: integer
        class_id:
          type: integer
        session_number:
          type: integer
        session_date:
          type: string
          format: date
        start_time:
          type: string
        end_time:
          type: string
        teacher_id:
          type: integer
        status:
          type: string
          enum: [SCHEDULED, COMPLETED, CANCELLED]
        created_by_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Attendance:
      type: object
      properties:
        id:
          type: integer
        enrollment_class_id:
          type: integer
        class_session_id:
          type: integer
        status:
          type: string
          enum: [ATTENDED, ABSENT_APPROVED_A, LEAVE_B, ABSENT_UNAPPROVED_C, TEACHER_ABSENT_D, TECH_ERROR_E]
        source:
          type: string
          enum: [MANUAL, EXCEL_IMPORT, TEACHER_UPLOAD, AUTO_SCHEDULE]
        created_by_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ImportBatch:
      type: object
      properties:
        id:
          type: integer
        uploaded_by_id:
          type: integer
        file_name:
          type: string
        import_type:
          type: string
          enum: [STUDENT_ENROLLMENT, ATTENDANCE, TEACHER_ATTENDANCE]
        total_rows:
          type: integer
        success_rows:
          type: integer
        failed_rows:
          type: integer
        status:
          type: string
          enum: [PREVIEW, PROCESSING, COMPLETED, PARTIAL_FAILED, FAILED, ROLLED_BACK]
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    ImportRow:
      type: object
      properties:
        id:
          type: integer
        import_batch_id:
          type: integer
        row_number:
          type: integer
        raw_data:
          type: object
        status:
          type: string
          enum: [PENDING, SUCCESS, FAILED]
        error_message:
          type: string
        entity_type:
          type: string
        entity_id:
          type: string
        created_at:
          type: string
          format: date-time

    CareLog:
      type: object
      properties:
        id:
          type: integer
        enrollment_id:
          type: integer
        cs_id:
          type: integer
        after_session_number:
          type: integer
        outcome:
          type: string
          enum: [POSITIVE, NEED_SUPPORT_SYSTEM, TEMP_PAUSE, NEED_CURRICULUM_SUPPORT, NEED_STUDENT_WEAKNESS_FIX, NEED_TEACHER_SUPPORT, NEGATIVE_WANTS_TO_STOP, NO_RESPONSE]
        content:
          type: string
        created_by_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CareTask:
      type: object
      properties:
        id:
          type: integer
        enrollment_id:
          type: integer
        assigned_to_id:
          type: integer
        type:
          type: string
          enum: [CALLBACK, HOT_ISSUE, FOLLOW_UP, AUTO_ATTENDANCE, SCHEDULE_DATA_ISSUE]
        title:
          type: string
        note:
          type: string
        due_at:
          type: string
          format: date-time
        priority:
          type: string
          enum: [LOW, NORMAL, HIGH, URGENT]
        status:
          type: string
          enum: [PENDING, DONE, CANCELLED]
        completed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AutoAttendanceSettings:
      type: object
      required: [enabled, delay_minutes, updated_at]
      properties:
        enabled:
          type: boolean
          example: true
        delay_minutes:
          type: integer
          minimum: 0
          maximum: 1440
          example: 15
        updated_at:
          type: string
          format: date-time
        updated_by_id:
          type: [integer, 'null']

    AttendanceStatus:
      type: string
      enum: [ATTENDED, ABSENT_APPROVED_A, LEAVE_B, ABSENT_UNAPPROVED_C, TEACHER_ABSENT_D, TECH_ERROR_E]

    ReconciliationState:
      type: string
      enum: [PENDING_TEACHER, PENDING_CS, MATCHED, CONFLICT, RESOLVED]

    AttendanceOpinionInput:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/AttendanceStatus' }
        rawValue: { type: [string, 'null'], maxLength: 100 }
        lessonTopic: { type: [string, 'null'], maxLength: 500 }
        note: { type: [string, 'null'], maxLength: 1000 }
        teacherId: { type: integer, description: Required when ADMIN/MANAGE records attendance for the selected teacher }

    ReconciliationItem:
      type: object
      required: [id, enrollmentClassId, classSessionId, reconciliationState]
      properties:
        id: { type: integer }
        enrollmentClassId: { type: integer }
        classSessionId: { type: integer }
        studentId: { type: integer }
        studentExternalId: { type: [string, 'null'] }
        studentName: { type: string }
        classId: { type: integer }
        classCode: { type: string }
        sessionDate: { type: string, format: date }
        startTime: { type: [string, 'null'] }
        teacherStatus:
          oneOf:
            - { $ref: '#/components/schemas/AttendanceStatus' }
            - { type: 'null' }
        csStatus:
          oneOf:
            - { $ref: '#/components/schemas/AttendanceStatus' }
            - { type: 'null' }
        finalStatus:
          oneOf:
            - { $ref: '#/components/schemas/AttendanceStatus' }
            - { type: 'null' }
        reconciliationState: { $ref: '#/components/schemas/ReconciliationState' }
        resolutionNote: { type: [string, 'null'] }

    PaginationMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }

    ReconciliationItemResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/ReconciliationItem' }
        meta: { type: [object, 'null'] }

    ReconciliationListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ReconciliationItem' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    ReconciliationStatsResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [conflictCount, pendingCsCount, pendingTeacherCount]
          properties:
            conflictCount: { type: integer, description: Số buổi đang lệch cần phân xử (state CONFLICT) }
            pendingCsCount: { type: integer, description: GV đã báo, CSKH chưa ghi nhận (state PENDING_CS) }
            pendingTeacherCount: { type: integer, description: CSKH đã ghi nhận, GV chưa báo (state PENDING_TEACHER) }
        meta: { type: [object, 'null'] }

    ReconciliationHistoryListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ReconciliationHistoryItem' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    ReconciliationHistoryItem:
      type: object
      required: [id, attendanceId, action, performedBy, createdAt]
      properties:
        id: { type: integer }
        attendanceId: { type: integer }
        action:
          type: string
          enum: [ATTENDANCE_CS_MARK, ATTENDANCE_BULK_APPROVED, ATTENDANCE_CONFLICT_RESOLVED]
        fromStatus: { type: [string, 'null'] }
        toStatus: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        performedBy: { type: string }
        createdAt: { type: string, format: date-time }
        student:
          type: [object, 'null']
          properties:
            id: { type: integer }
            fullName: { type: string }
            externalId: { type: [string, 'null'] }
            phone: { type: [string, 'null'] }
        className: { type: [string, 'null'] }
        session:
          type: [object, 'null']
          properties:
            id: { type: integer }
            sessionNumber: { type: integer }
            sessionDate: { type: string, format: date }
            startTime: { type: [string, 'null'] }
            endTime: { type: [string, 'null'] }

    TeacherSessionListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            type: object
            required: [id, classId, sessionDate, students]
            properties:
              id: { type: integer }
              classId: { type: integer }
              classCode: { type: string }
              sessionDate: { type: string, format: date }
              startTime: { type: [string, 'null'] }
              endTime: { type: [string, 'null'] }
              students:
                type: array
                items: { $ref: '#/components/schemas/ReconciliationItem' }
        meta: { type: [object, 'null'] }

    WorkbookPreviewCell:
      type: object
      required: [sheet, address, row, rawValue, category]
      properties:
        sheet: { type: string }
        address: { type: string }
        row: { type: integer }
        sessionDate: { type: [string, 'null'], format: date }
        startTime: { type: [string, 'null'] }
        studentExternalId: { type: [string, 'null'] }
        classCode: { type: [string, 'null'] }
        rawValue: {}
        oldStatus:
          oneOf:
            - { $ref: '#/components/schemas/AttendanceStatus' }
            - { type: 'null' }
        newStatus:
          oneOf:
            - { $ref: '#/components/schemas/AttendanceStatus' }
            - { type: 'null' }
        category: { type: string, enum: [NEW, UNCHANGED, OVERWRITE, ERROR, OUT_OF_SCOPE] }
        message: { type: [string, 'null'] }

    WorkbookPreviewResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [previewId, expiresAt, summary, cells]
          properties:
            previewId: { type: string }
            expiresAt: { type: string, format: date-time }
            summary:
              type: object
              required: [new, unchanged, overwrite, error, outOfScope]
              properties:
                new: { type: integer }
                unchanged: { type: integer }
                overwrite: { type: integer }
                error: { type: integer }
                outOfScope: { type: integer }
            cells:
              type: array
              items: { $ref: '#/components/schemas/WorkbookPreviewCell' }
        meta: { type: [object, 'null'] }

    WorkbookCommitResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [processed, matched, pending, conflict, skipped, errors]
          properties:
            processed: { type: integer }
            matched: { type: integer }
            pending: { type: integer }
            conflict: { type: integer }
            skipped: { type: integer }
            errors:
              type: array
              items: { $ref: '#/components/schemas/WorkbookPreviewCell' }
        meta: { type: [object, 'null'] }

    EnrollmentSummaryStats:
      type: object
      properties:
        total_enrollments:
          type: integer
        unique_students:
          type: integer
        status_breakdown:
          type: object
          additionalProperties:
            type: integer
        status_percentage:
          type: object
          additionalProperties:
            type: number

    AttendanceStats:
      type: object
      properties:
        total_sessions:
          type: integer
        total_attendances:
          type: integer
        attendance_rate:
          type: number
        breakdown:
          type: object
          additionalProperties:
            type: integer

    CarePivotMatrix:
      type: object
      properties:
        session_numbers:
          type: array
          items:
            type: integer
        outcomes:
          type: array
          items:
            type: string
        matrix:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: integer
        total_logs:
          type: integer

    TasksOverviewStats:
      type: object
      properties:
        pending_total:
          type: integer
        overdue:
          type: integer
        due_today:
          type: integer
        due_this_week:
          type: integer
        urgent_hot_issues:
          type: integer
        completed_recent:
          type: integer


